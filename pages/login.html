<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Login to BusTrack"
    >

    <title>Login - BusTrack</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">


    <!-- =================================
         NAVBAR
    ================================== -->

    <header class="navbar auth-navbar">

        <div class="container navbar-container">


            <a
                href="../index.html"
                class="logo"
            >

                <span class="logo-icon">
                    🚌
                </span>

                <span>
                    Bus<span class="logo-highlight">
                        Track
                    </span>
                </span>

            </a>


            <div class="nav-actions">

                <button
                    class="theme-btn"
                    id="themeBtn"
                    title="Toggle dark mode"
                >
                    🌙
                </button>

                <a
                    href="register.html"
                    class="login-btn"
                >
                    Register
                </a>

            </div>


        </div>

    </header>



    <!-- =================================
         LOGIN
    ================================== -->

    <main class="auth-main">

        <div class="auth-container">


            <div class="auth-card">


                <!-- HEADER -->

                <div class="auth-header">

                    <div class="auth-icon">
                        🚌
                    </div>

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Login to your BusTrack account
                        to continue.
                    </p>

                </div>



                <!-- ERROR MESSAGE -->

                <div
                    class="form-error"
                    id="loginError"
                >
                </div>



                <!-- SUCCESS MESSAGE -->

                <div
                    class="form-success"
                    id="loginSuccess"
                >
                </div>



                <!-- FORM -->

                <form
                    class="auth-form"
                    id="loginForm"
                    novalidate
                >


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉️
                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <span
                            class="validation-message"
                            id="emailError"
                        >
                            Please enter a valid email address.
                        </span>

                    </div>



                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                👁️
                            </button>

                        </div>

                        <span
                            class="validation-message"
                            id="passwordError"
                        >
                            Please enter your password.
                        </span>

                    </div>



                    <!-- OPTIONS -->

                    <div class="form-row">

                        <div class="checkbox-group">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe"
                            >

                            <label for="rememberMe">
                                Remember me
                            </label>

                        </div>


                        <a
                            href="#"
                            class="forgot-link"
                            id="forgotPassword"
                        >
                            Forgot password?
                        </a>

                    </div>



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="auth-submit"
                        id="loginButton"
                    >

                        <span id="loginButtonText">
                            Login
                        </span>

                    </button>


                </form>



                <!-- DIVIDER -->

                <div class="auth-divider">
                    OR
                </div>



                <!-- SOCIAL LOGIN -->

                <div class="social-buttons">

                    <button
                        type="button"
                        class="social-btn"
                        id="googleLogin"
                    >
                        <span>G</span>
                        Continue with Google
                    </button>

                    <button
                        type="button"
                        class="social-btn"
                        id="guestLogin"
                    >
                        👤
                        Continue as Guest
                    </button>

                </div>



                <!-- FOOTER -->

                <div class="auth-footer">

                    <p>

                        Don't have an account?

                        <a href="register.html">
                            Create Account
                        </a>

                    </p>

                </div>


            </div>


        </div>

    </main>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="../js/app.js"></script>

    <script src="../js/auth.js"></script>


</body>

</html>
